[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q -m 'not carga'"
markers = [
    "carga: testes de carga/estresse (excluidos do conjunto padrao)",
]

[tool.coverage.run]
source = ["pws"]
omit = ["pws/ui/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
